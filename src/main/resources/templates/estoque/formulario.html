<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: menu_principal}"></div>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="bg-white p-5 rounded-4 shadow-sm border">

                <h2 class="fw-bold text-primary border-bottom pb-3 mb-4">
                    <i class="bi bi-tag me-2"></i>
                    <!-- Se tiver ID é edição, se não tiver é cadastro novo -->
                    <span th:text="${produtoEstoque.id != null ? 'Editar Produto' : 'Novo Produto'}">Novo Produto</span>
                </h2>

                <!-- O Formulário aponta para o método Salvar no Controller -->
                <form th:action="@{/estoque/salvar}" th:object="${produtoEstoque}" method="post">

                    <!-- ID Oculto (Necessário para o Hibernate saber que é um Update e não um Insert) -->
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="nome" class="form-label fw-bold">Nome do Produto</label>
                        <input type="text" class="form-control" id="nome" th:field="*{nome}" required placeholder="Ex: Teclado Mecânico">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="preco" class="form-label fw-bold">Preço Unitário (R$)</label>
                            <div class="input-group">
                                <span class="input-group-text">R$</span>
                                <input type="number" step="0.01" min="0" class="form-control" id="preco" th:field="*{preco}" required placeholder="0.00">
                            </div>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="quantidadeEmEstoque" class="form-label fw-bold">Qtd. em Estoque Inicial</label>
                            <input type="number" min="0" class="form-control" id="quantidadeEmEstoque" th:field="*{quantidadeEmEstoque}" required placeholder="Ex: 50">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="descricao" class="form-label fw-bold">Descrição Detalhada</label>
                        <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="4" required placeholder="Digite os detalhes do produto..."></textarea>
                    </div>

                    <hr class="text-muted">

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a th:href="@{/produto-estoque}" class="btn btn-outline-secondary px-4 fw-bold shadow-sm">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                            <i class="bi bi-save me-1"></i> Salvar Produto
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
