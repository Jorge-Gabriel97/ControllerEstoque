<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">


<div th:replace="~{fragments/navbar :: menu_principal}"></div>

<div class="container mt-5 mb-5">
    <div class="bg-white p-5 rounded-4 shadow-sm border">

        <!-- Cabeçalho da Lista -->
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="fw-bold text-primary m-0"><i class="bi bi-box-seam me-2"></i>Estoque de Produtos</h2>
            <a th:href="@{/estoque/novo}" class="btn btn-success px-4 fw-bold shadow-sm">
                <i class="bi bi-plus-lg me-1"></i> Novo Produto
            </a>
        </div>

        <!-- Tabela de Produtos -->
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Descrição</th>
                    <th scope="col">Preço (R$)</th>
                    <th scope="col">Qtd. Estoque</th>
                    <th scope="col" class="text-center" width="150">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produto : ${produtos}">
                    <td class="fw-bold text-secondary" th:text="${produto.id}">1</td>
                    <td th:text="${produto.nome}">Nome do Produto</td>
                    <td class="text-truncate" style="max-width: 200px;" th:text="${produto.descricao}">Descrição breve...</td>
                    <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">0,00</td>
                    <td>
                        <span class="badge rounded-pill text-bg-primary fs-6" th:text="${produto.quantidadeEmEstoque}">10</span>
                    </td>
                    <td class="text-center">
                        <!-- Botão Editar -->
                        <a th:href="@{/produto-estoque/editar/{id}(id=${produto.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <!-- Botão Remover -->
                        <a th:href="@{/produto-estoque/remover/{id}(id=${produto.id})}" class="btn btn-sm btn-outline-danger ms-1" title="Remover" onclick="return confirm('Tem certeza que deseja excluir este produto?');">
                            <i class="bi bi-trash3"></i>
                        </a>
                    </td>
                </tr>

                <!-- Mensagem caso o estoque esteja vazio -->
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inboxes fs-1 d-block mb-2"></i>
                        Nenhum produto cadastrado no estoque ainda.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
