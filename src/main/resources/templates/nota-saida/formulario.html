<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Nota de Saída</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2>🛒 Nova Nota de Saída (Venda)</h2>
<hr>

<!-- Alerta caso o estoque seja insuficiente (Vindo do BO) -->
<div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

<form th:action="@{/notas-saida/salvar}" th:object="${notaSaida}" method="post">

    <input type="hidden" th:field="*{id}">

    <div class="card mb-4">
        <div class="card-header bg-dark text-white">Dados da Venda</div>
        <div class="card-body">
            <p class="text-muted">A data/hora e o valor total serão calculados automaticamente pelo sistema após a confirmação.</p>
        </div>
    </div>

    <h4>Itens da Nota</h4>
    <div class="table-responsive">
        <table class="table border">
            <thead class="table-light">
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Valor Unitário (R$)</th>
            </tr>
            </thead>
            <tbody>
            <!-- Estamos enviando o item para o índice 0 da lista (itens[0]) -->
            <tr>
                <td>
                    <select name="itens[0].produto.id" class="form-select" required>
                        <option value="">Selecione um produto...</option>
                        <option th:each="p : ${produtos}"
                                th:value="${p.id}"
                                th:text="${p.nome} + ' (Estoque: ' + ${p.quantidade} + ')'">
                        </option>
                    </select>
                </td>
                <td>
                    <input type="number" name="itens[0].quantidade" class="form-control" min="1" required>
                </td>
                <td>
                    <input type="number" step="0.01" name="itens[0].valorUnitario" class="form-control" required>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-success">Finalizar Venda</button>
        <a th:href="@{/notas-saida}" class="btn btn-danger">Cancelar</a>
    </div>
</form>

</body>
</html>
